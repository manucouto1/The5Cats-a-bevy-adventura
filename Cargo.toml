[package]
name = "the5cats"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.16.1" }
bevy_rapier2d = "0.30.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = "0.27.1"
strum_macros = "0.27.1"
rand = "0.8"
# Already in the tree via bevy_image; used to write the R16Float SDF texture.
half = "2.6"

# The browser build needs `getrandom` wired to the JS crypto API; `rand`
# pulls it in and has no other way to seed itself there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[workspace]
resolver = "2"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
# Workaround for objc2-foundation 0.2.2 NSFastEnumeration type-encoding panic
# on macOS 15+ ("expected return to have type code 'q', but found 'Q'").
# objc2's runtime verification is gated on debug_assertions; disabling it
# bypasses the bogus check until winit/bevy upgrade past objc2 0.5.
debug-assertions = false

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# What gets published: link-time optimization and no debug symbols, which
# takes the binary from ~100 MB to something a player can reasonably
# download.
[profile.release]
lto = "thin"
strip = "symbols"
